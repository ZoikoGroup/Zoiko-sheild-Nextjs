              schema:
                $ref: '#/components/schemas/ErrorBody'
  /trust/sources/{id}:
    get:
      tags: [public]
      summary: Trust source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [source]
                properties:
                  source:
                    $ref: '#/components/schemas/Citation'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /integrations/catalog:
    get:
      tags: [public]
      summary: Integrations catalog
      parameters:
