openapi: 3.0.3
info:
  title: ZoikoShield Public Assistant API v1
  description: Public BFF for anonymous visitors (no tenant/auth context)
  version: 1.0.0
servers:
  - url: /api/public/chat/v1
tags:
  - name: public
    description: Public endpoints (no auth)
paths:
  /config:
    get:
      tags: [public]
      summary: Get assistant config, flags, route registry
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /status:
    get:
      tags: [public]
      summary: Get assistant status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /sessions:
    post:
      tags: [public]
      summary: Create guest session (only on first submitted message/flow action)
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreated'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreated'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /sessions/clear:
    post:
      tags: [public]
      summary: Clear session / bump epoch
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [epoch]
                properties:
                  epoch:
                    type: integer
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /messages:
    post:
      tags: [public]
      summary: Send message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageAccepted'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResult'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /messages/{id}/events:
    get:
      tags: [public]
      summary: SSE events
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream with SSE event objects
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /messages/{id}/cancel:
    post:
      tags: [public]
      summary: Cancel message
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled:
                    type: boolean
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /sources/{id}:
    get:
      tags: [public]
      summary: Get citation metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [source]
                properties:
                  source:
                    $ref: '#/components/schemas/CitationSource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /help/home:
    get:
      tags: [public]
      summary: Help home tiles
      responses:
        '200':
