components:
  schemas:
    ErrorBody:
      type: object
      required: [error_code, user_safe_message, correlation_id]
      additionalProperties: true
      properties:
        error_code:
          type: string
        user_safe_message:
          type: string
        field_errors:
          type: object
          additionalProperties:
            type: string
        retry_after:
          type: number
        correlation_id:
          type: string

    Option:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string

    RouteLink:
      type: object
      required: [route_key, label, url]
      properties:
        route_key:
          type: string
        label:
          type: string
        url:
          type: string

    Citation:
      type: object
      required: [source_id, title, url, summary]
      properties:
        source_id:
          type: string
        title:
          type: string
        url:
          type: string
        summary:
          type: string

    AnswerBlock:
      oneOf:
        - type: object
          required: [type, text]
          properties:
            type:
              type: string
              enum: [paragraph]
            text:
              type: string
        - type: object
          required: [type, items]
          properties:
            type:
              type: string
              enum: [bullets]
            items:
              type: array
              items:
                type: string

    FollowUp:
      type: object
      required: [intent_key, label]
      properties:
        intent_key:
          type: string
        label:
          type: string

    Answer:
      type: object
      required: [outcome, blocks, citations, follow_ups]
      properties:
        outcome:
          type: string
          enum: [ANSWERED, LIMITED, ABSTAINED, PENDING, REJECTED, ERROR]
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/AnswerBlock'
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        follow_ups:
          type: array
          items:
            $ref: '#/components/schemas/FollowUp'
        route:
          $ref: '#/components/schemas/RouteLink'

    SSEData:
      type: object
      additionalProperties: true
      properties:
        text:
          type: string
        block_index:
          type: number
        answer:
          $ref: '#/components/schemas/Answer'
        error_code:
          type: string
        message:
          type: string

    SseEvent:
      type: object
      required: [seq, type, epoch, data]
      additionalProperties: true
      properties:
        seq:
          type: integer
        type:
          type: string
          enum: [acknowledged, progress, delta, final, safety_limited, error]
        epoch:
          type: integer
        data:
          $ref: '#/components/schemas/SSEData'

    StatusBody:
      type: object
      required: [state, mode, fallback_links]
      properties:
        state:
          type: string
          enum: [enabled, degraded, disabled]
        mode:
          type: string
          enum: [ai, static]
        fallback_links:
          type: array
          items:
            $ref: '#/components/schemas/RouteLink'

    Flags:
      type: object
      required:
        - assistant_launcher
        - assistant_ai_answers
        - assistant_lead_submit
        - assistant_support_submit
        - assistant_trust_gated
        - assistant_public_pricing
        - assistant_connector_claims
        - assistant_privacy_write
        - assistant_kill
      additionalProperties: false
      properties:
        assistant_launcher:
          type: boolean
        assistant_ai_answers:
          type: boolean
        assistant_lead_submit:
          type: boolean
        assistant_support_submit:
          type: boolean
        assistant_trust_gated:
          type: boolean
        assistant_public_pricing:
          type: boolean
        assistant_connector_claims:
          type: boolean
        assistant_privacy_write:
          type: boolean
        assistant_kill:
          type: boolean

    ConfigBody:
      type: object
      required: [display_name, clearance, flags, routes, markets, intake, policy_versions]
      properties:
        display_name:
          type: string
        clearance:
          type: string
          enum: [public]
        flags:
          $ref: '#/components/schemas/Flags'
        routes:
          type: array
          items:
            $ref: '#/components/schemas/RouteLink'
        markets:
          type: array
          items:
            $ref: '#/components/schemas/Option'
        intake:
          type: object
          additionalProperties:
            type: boolean
        policy_versions:
          type: object
          required: [answer_policy]
          properties:
            notice:
              type: string
              nullable: true
            answer_policy:
              type: string

    SessionCreated:
      type: object
      required: [expires_at, ttl_seconds, epoch]
      properties:
        expires_at:
          type: string
          format: date-time
        ttl_seconds:
          type: number
        epoch:
          type: integer

    MessageRequest:
      type: object
      required: [client_message_id, content]
      properties:
        client_message_id:
          type: string
        content:
          type: string
        locale:
          type: string
        intent_key:
          type: string
        consent_snapshot_id:
          type: string

    MessageAccepted:
      type: object
      required: [message_id]
      properties:
        message_id:
          type: string

    MessageResult:
      type: object
      required: [answer, citations]
      properties:
        answer:
          $ref: '#/components/schemas/Answer'
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'

    CitationSource:
      type: object
      required: [source_id, title, url, summary, kind, revision]
      properties:
        source_id:
          type: string
        title:
          type: string
        url:
          type: string
        summary:
          type: string
        kind:
          type: string
        revision:
          type: integer

    HelpSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          maxLength: 200
        locale:
          type: string
        market:
          type: string
        cursor:
          type: string

    GuideStepRequest:
      type: object
      required: [step_id, choice]
      properties:
        step_id:
          type: string
        choice:
          type: string

    DiscoveryMatchesRequest:
      type: object
      properties:
        priority:
          type: string
        role:
          type: string
        environment:
          type: string
        market:
          type: string

    CommercialFitRequest:
      type: object
      required: [market]
      properties:
        market:
          type: string
        asset_band:
          type: string
        ingestion_band:
          type: string

    DeploymentGuideRequest:
      type: object
      properties: {}

    OnboardingChecklistRequest:
      type: object
      properties: {}

    FeedbackRequest:
      type: object
      required: [target_type, target_id, rating]
      properties:
        target_type:
          type: string
          enum: [message, flow, discovery]
        target_id:
          type: string
        rating:
          type: string
          enum: [helpful, not_helpful]
        reason_code:
          type: string

    SubmissionKeyRequest:
      type: object
      required: [journey]
      properties:
        journey:
          type: string

    FieldSpec:
      type: object
      required: [name, label, type, required, max]
      properties:
        name:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [text, email, textarea, select]
        required:
          type: boolean
        min:
          type: number
        max:
          type: number
        options_from:
          type: string
        free_text:
          type: boolean
        hint:
          type: string

    ResolvedForm:
      type: object
      required: [kind, fields]
      properties:
        kind:
          type: string
          enum: [DEMO, SUPPORT, QUOTE, TRUST_ACCESS, TECH_EVAL, ONBOARDING, PRIVACY]
        fields:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/FieldSpec'
              - type: object
                properties:
                  options:
